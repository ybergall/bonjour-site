<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ULB</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8f9fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 24px 28px;
      text-align: center;
    }
    img {
      display: block;
      width: min(360px, 80vw);
      height: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="../shared/ulb-logo.svg" alt="ULB logo">
  </div>
</body>
</html>
